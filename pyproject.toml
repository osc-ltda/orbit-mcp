[project]
name = "orbits-mcp"
version = "0.1.0"
description = "Servidor MCP de Orbits: crear tests y analizar resultados desde agentes de código"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Francisco C. Ossa", email = "francisco@oza.cl" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28.1",
]

[project.scripts]
orbits-mcp = "orbits_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
